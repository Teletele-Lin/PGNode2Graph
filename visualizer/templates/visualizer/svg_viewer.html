{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ viz.name }} - SVG Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: auto;
        }

        #graph {
            width: auto;
            padding: 0;
            margin: 5%;
            display: block;
        }

        #graph svg {
            display: block;
            margin: 0;
            padding: 0;
            width: auto !important;
            height: auto !important;
            max-width: none !important;
            min-width: 0 !important;
            min-height: 0 !important;
        }
    </style>
</head>
<body>
    <div id="graph"></div>

    <script type="text/javascript" src="{% static 'js/jquery-2.1.3.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/jquery.mousewheel.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/jquery.color.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/jquery.graphviz.svg.js' %}"></script>

    {{ svg_content|json_script:"svg-content-data" }}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const svgContentElement = document.getElementById('svg-content-data');
            if (svgContentElement) {
                try {
                    const svgString = JSON.parse(svgContentElement.textContent);
                    $("#graph").graphviz({
                        svg: svgString,
                        ready: function() {
                            var gv = this;
                            
                            // 获取SVG元素
                            const svgElement = document.querySelector('#graph svg');
                            if (svgElement) {
                                // 设置固定宽度为1200px，使其不拉伸占满窗口
                                svgElement.setAttribute('width', '1200');
                                svgElement.setAttribute('height', 'auto');
                                svgElement.style.width = '1200px';
                                svgElement.style.height = 'auto';
                            }
                            
                            // 节点点击交互
                            gv.nodes().click(function () {
                                var $set = $();
                                $set.push(this);
                                $set = $set.add(gv.linkedFrom(this, true));
                                $set = $set.add(gv.linkedTo(this, true));
                                gv.highlight($set, true);
                                gv.bringToFront($set);
                            });
                            
                            // ESC键取消高亮
                            $(document).keydown(function (evt) {
                                if (evt.keyCode == 27) {
                                    gv.highlight();
                                }
                            });
                        }
                    });
                } catch (error) {
                    console.error('Failed to parse SVG content from JSON:', error);
                    document.getElementById('graph').innerHTML = '<p style="color: red;">Failed to load SVG</p>';
                }
            }
        });
    </script>
</body>
</html>
